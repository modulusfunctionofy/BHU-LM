<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHU-LM | User</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>

<!-- ===================== AUTH GUARD ===================== -->
<script>
    if (!localStorage.getItem('bhu_loggedin') || localStorage.getItem('bhu_role') !== 'user') {
        window.location.href = 'index.html';
    }
</script>

<!-- ===================== TOP BAR ===================== -->
<div class="topbar">
    <button class="hamburger" id="hamburger-btn" title="Menu">&#9776;</button>
    <div class="app-title">
        BHU-LM
        <span>User</span>
    </div>
    <div class="topbar-right">
        <span class="username-label" id="topbar-username"></span>
        <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
</div>

<!-- ===================== TAB BAR ===================== -->
<div class="tabbar">
    <div class="tab active" id="tab-mediawiki" onclick="switchTab('mediawiki')">&#128196; Mediawiki</div>
    <div class="tab" id="tab-pdfdoc" onclick="switchTab('pdfdoc')">&#128209; PDF Doc</div>
</div>

<!-- ===================== SIDEBAR OVERLAY ===================== -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ===================== SIDEBAR DRAWER ===================== -->
<div class="sidebar" id="sidebar">
    <div class="sidebar-head">
        <span class="sidebar-title">BHU-LM</span>
        <button class="sidebar-close" onclick="closeSidebar()">&#10005;</button>
    </div>

    <div class="sidebar-section-label">Navigation</div>
    <a class="sidebar-item active" href="user.html">
        <span class="item-icon">&#128196;</span> Knowledge Base
    </a>

    <div class="sidebar-section-label">Account</div>
    <div class="sidebar-item" onclick="alert('Account settings coming soon.')">
        <span class="item-icon">&#128100;</span> My Account
    </div>
    <div class="sidebar-item" onclick="alert('Preferences coming soon.')">
        <span class="item-icon">&#9881;</span> Preferences
    </div>

    <hr class="sidebar-divider">

    <div class="sidebar-bottom">
        <a class="sidebar-item" href="docs.html" target="_blank">
            <span class="item-icon">&#10067;</span> Help &amp; Docs
        </a>
        <div class="sidebar-item" onclick="doLogout()">
            <span class="item-icon">&#8594;</span> Logout
        </div>
    </div>
</div>

<!-- ===================== MAIN LAYOUT ===================== -->
<div class="main-layout">

    <!-- LEFT: Category Sidebar -->
    <div class="cat-sidebar" id="cat-sidebar">
        <div class="cat-header" id="cat-header-label">Categories</div>
        <div id="cat-list">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- MIDDLE: Chunks + Query -->
    <div class="middle-panel">

        <!-- Chunks area -->
        <div class="chunks-area" id="chunks-area">
            <div class="chunks-scroll" id="chunks-scroll">

                <!-- Empty state shown before first query -->
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">&#128269;</div>
                    <p>Select a category and enter a query below to retrieve document chunks.</p>
                </div>

                <!-- Chunk cards injected here by JS -->
                <!-- Example structure (hidden, used as template):
                <div class="chunk-card">
                    <div class="chunk-meta">
                        <span class="chunk-score">score: 0.87</span>
                        source_file.html &nbsp;|&nbsp; chunk #3
                    </div>
                    <div class="chunk-text">... text ...</div>
                </div>
                -->

            </div>
        </div>

        <!-- Query bar area -->
        <div class="query-area">

            <!-- Active category label -->
            <div class="active-cat-label">
                Category: <span id="active-cat-name">None selected</span>
            </div>

            <!-- Query input row -->
            <div class="query-input-row">
                <textarea
                    id="query-input"
                    class="query-textarea"
                    placeholder="Type your question here... (Shift+Enter for new line, Enter to send)"
                    rows="2"
                ></textarea>
                <button class="send-btn" id="send-btn" onclick="sendQuery()" title="Send">
                    &#10148;
                </button>
            </div>

                        <!-- Controls row -->
            <div class="controls-row">

                <!-- Image toggle -->
                <label class="toggle-wrap" title="Toggle image retrieval">
                    <input type="checkbox" id="img-toggle" onchange="onImgToggle(this)">
                    <span class="toggle-track"></span>
                    <span class="toggle-label">Img</span>
                </label>

                <!-- No. images -->
                <div id="img-count-wrap" class="img-count-wrap" style="display:none;">
                    <label for="img-count-input" class="img-count-label">No. images</label>
                    <input
                        type="number"
                        id="img-count-input"
                        class="img-count-input"
                        value="3"
                        min="1"
                        max="10"
                    >
                </div>

                <!-- MMR toggle -->
                <label class="toggle-wrap" title="Maximal Marginal Relevance — reduces redundancy in retrieved chunks">
                    <input type="checkbox" id="mmr-toggle" onchange="onMMRToggle(this)">
                    <span class="toggle-track"></span>
                    <span class="toggle-label">MMR</span>
                </label>

                <!-- Help link for MMR -->
                <a class="help-marker" href="docs.html#mmr" target="_blank" title="What is MMR?">?</a>

                <!-- Spacer -->
                <span style="flex:1"></span>

                <!-- Status text -->
                <span class="status-text" id="status-text"></span>

            </div>
        </div>
    </div>

    <!-- RIGHT: Image Panel -->
    <div class="image-panel" id="image-panel">

        <div class="image-panel-header">
            Images
        </div>

        <div class="image-panel-body" id="image-panel-body">

            <!-- Shown when IMAGE_OPTION = 0 (default) -->
            <!-- NOTE: This <p> should be set to display:none via CSS when image is turned on in backend -->
            <p class="img-off-msg" id="img-off-msg">Image section is off</p>

            <!-- 10 image slots — display:none by default.
                 JS will fill .src with the image path and remove display:none when images arrive.
                 CSS will also remove display:none when image option is enabled. -->
            <div class="img-slots" id="img-slots">
                <div class="img-slot hidden" data-slot="0">
                    <img src="" alt="Retrieved image 1" class="retrieved-img" id="rimg-0">
                    <div class="img-slot-label" id="rimg-label-0"></div>
                </div>
                <div class="img-slot hidden" data-slot="1">
                    <img src="" alt="Retrieved image 2" class="retrieved-img" id="rimg-1">
                    <div class="img-slot-label" id="rimg-label-1"></div>
                </div>
                <div class="img-slot hidden" data-slot="2">
                    <img src="" alt="Retrieved image 3" class="retrieved-img" id="rimg-2">
                    <div class="img-slot-label" id="rimg-label-2"></div>
                </div>
                <div class="img-slot hidden" data-slot="3">
                    <img src="" alt="Retrieved image 4" class="retrieved-img" id="rimg-3">
                    <div class="img-slot-label" id="rimg-label-3"></div>
                </div>
                <div class="img-slot hidden" data-slot="4">
                    <img src="" alt="Retrieved image 5" class="retrieved-img" id="rimg-4">
                    <div class="img-slot-label" id="rimg-label-4"></div>
                </div>
                <div class="img-slot hidden" data-slot="5">
                    <img src="" alt="Retrieved image 6" class="retrieved-img" id="rimg-5">
                    <div class="img-slot-label" id="rimg-label-5"></div>
                </div>
                <div class="img-slot hidden" data-slot="6">
                    <img src="" alt="Retrieved image 7" class="retrieved-img" id="rimg-6">
                    <div class="img-slot-label" id="rimg-label-6"></div>
                </div>
                <div class="img-slot hidden" data-slot="7">
                    <img src="" alt="Retrieved image 8" class="retrieved-img" id="rimg-7">
                    <div class="img-slot-label" id="rimg-label-7"></div>
                </div>
                <div class="img-slot hidden" data-slot="8">
                    <img src="" alt="Retrieved image 9" class="retrieved-img" id="rimg-8">
                    <div class="img-slot-label" id="rimg-label-8"></div>
                </div>
                <div class="img-slot hidden" data-slot="9">
                    <img src="" alt="Retrieved image 10" class="retrieved-img" id="rimg-9">
                    <div class="img-slot-label" id="rimg-label-9"></div>
                </div>
            </div>

        </div>
    </div>

</div><!-- end .main-layout -->

<script src="js/user.js"></script>
</body>
</html>
